name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      # Fast tests run in parallel (xdist) and are a HARD gate.
      - name: Tests — fast (parallel)
        run: pytest -m "not slow" -n auto
      # The slow tests are stochastic solvers bounded by a *wall-clock* timeout:
      # whether they converge depends on the runner's speed, so they flake on shared
      # CI VMs (they get a full core via serial execution, but a slow VM still does
      # fewer iterations than a fast one). Keep running them for signal, but treat
      # them as best-effort — a flaky non-convergence must not block CI. The real
      # gates are lint, format, types, the fast suite, and the build smoke test.
      - name: Tests — slow solvers (serial, best-effort)
        continue-on-error: true
        run: pytest -m slow

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      # Smoke test: the wheel runs and its bundled n-gram tables actually load
      # (a real decrypt requires the data; assert on the plaintext, not the
      # verdict-based exit code, which is correctly non-zero on short inputs).
      - name: Smoke test (engine + bundled data)
        run: |
          butt --version
          # `crack` exits non-zero on an ambiguous verdict (expected on this short
          # input); `|| true` keeps `set -e` from failing the step — we assert on
          # the recovered plaintext below, not the exit code.
          out=$(butt crack caesar "Wkh txlfn eurzq ira" --json || true)
          echo "$out"
          echo "$out" | python -c "import sys, json; d = json.load(sys.stdin); assert d['plaintext'].lower().startswith('the quick brown fox'), d; print('smoke ok')"
